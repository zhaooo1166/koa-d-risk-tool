<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOA-D精准风险预警工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        /* 移除未使用的滑块样式 */
    </style>
</head>
<body class="p-4 sm:p-8 min-h-screen flex items-start justify-center">

    <div id="app" class="w-full max-w-xl bg-white shadow-2xl rounded-xl p-6 sm:p-8 border border-gray-100">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 tracking-tight">KOA-D 风险预警工具</h1>
            <p class="text-gray-500 mt-2 text-sm sm:text-base">基于ML模型关键因子，实现老年骨关节炎患者抑郁风险精准筛查。</p>
        </header>

        <!-- Input Form -->
        <div id="risk-form" class="space-y-6">

            <!-- 1. 慢性疼痛程度 (VAS/NRS) -->
            <div class="bg-indigo-50 p-4 rounded-lg shadow-inner">
                <label class="block text-base font-semibold text-indigo-800 mb-3">1. 慢性疼痛程度 (0-10分，VAS/NRS):</label>
                <div class="space-y-2 text-sm text-indigo-700">
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="painLevel" value="0" class="text-indigo-500">
                        <span>无疼痛 (0 分)</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="painLevel" value="3" class="text-indigo-500">
                        <span>轻度疼痛 (1-3 分)</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="painLevel" value="6" checked class="text-indigo-500">
                        <span>中度疼痛 (4-6 分)</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="painLevel" value="10" class="text-indigo-500">
                        <span>重度疼痛 (7-10 分)</span>
                    </label>
                </div>
            </div>

            <!-- 2. 社会参与度/独居状态 -->
            <div class="bg-blue-50 p-4 rounded-lg shadow-inner">
                <label class="block text-base font-semibold text-blue-800 mb-3">2. 社会支持与参与度:</label>
                <div class="space-y-2 text-sm text-blue-700">
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="socialStatus" value="10" checked class="text-blue-500">
                        <span>独居，且很少参与社区活动</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="socialStatus" value="5" class="text-blue-500">
                        <span>与家人同住，但很少参与社区活动</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="socialStatus" value="0" class="text-blue-500">
                        <span>经常与人交流，每周至少参加一次社区活动</span>
                    </label>
                </div>
            </div>

            <!-- 3. 合并慢性病数量（心血管/消化系统） -->
            <div class="bg-red-50 p-4 rounded-lg shadow-inner">
                <label class="block text-base font-semibold text-red-800 mb-3">3. 共病数量 (心血管/消化系统):</label>
                <div class="space-y-2 text-sm text-red-700">
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="comorbidityNum" value="0" class="text-red-500">
                        <span>0 种</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="comorbidityNum" value="1" checked class="text-red-500">
                        <span>1 种</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="comorbidityNum" value="2" class="text-red-500">
                        <span>2 种</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="comorbidityNum" value="3" class="text-red-500">
                        <span>3 种及以上</span>
                    </label>
                </div>
            </div>

            <!-- 4. 低BMI/衰弱风险 -->
            <div class="bg-green-50 p-4 rounded-lg shadow-inner">
                <label class="block text-base font-semibold text-green-800 mb-3">4. 低体重/营养风险 (BMI < 18.5):</label>
                <div class="space-y-2 text-sm text-green-700">
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="lowBmi" value="15" checked class="text-green-500">
                        <span>体重过轻 (BMI &lt; 18.5) 或近期非主动性体重下降</span>
                    </label>
                    <label class="flex items-center space-x-2">
                        <input type="radio" name="lowBmi" value="0" class="text-green-500">
                        <span>BMI正常或超重 (无体重过轻风险)</span>
                    </label>
                </div>
            </div>
            
            <!-- Calculate Button -->
            <button onclick="calculateRisk()" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 ease-in-out shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50 mt-4">
                立即评估 KOA-D 风险
            </button>
        </div>

        <!-- Result Display -->
        <div id="resultBox" class="mt-8 hidden p-6 border-4 rounded-xl transition duration-500">
            <h2 class="text-xl font-bold mb-2 flex items-center space-x-2">
                <svg id="resultIcon" class="w-6 h-6 text-gray-700" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm-7-9a1 1 0 011-1h10a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"></path></svg>
                <span id="riskLevel"></span>
            </h2>
            <p id="riskScoreDisplay" class="text-sm font-medium mb-4"></p>
            <p id="riskGuidance" class="text-base leading-relaxed"></p>
        </div>

        <!-- Developer Attribution Footer -->
        <footer class="mt-8 pt-4 border-t border-gray-200 text-center text-xs text-gray-400">
            <p>原型开发与实现：谢娟（安徽建筑大学）, 李海龙（阜阳市第二人民医院）, 李春（合肥市第一人民医院）</p>
            <p class="mt-1">基于 CHARLS 数据和 GBDT-SHAP 风险因子识别技术</p>
        </footer>

    </div>

    <script>
        // 风险评分的权重和阈值 (模拟ML模型发现的关键因子权重)
        // 总分范围: 0 (最低风险) 到 80 (最高风险)
        const WEIGHTS = {
            pain: 4,      // 疼痛 (0-10分，权重最高)
            social: 1,    // 社会支持 (权重中等)
            comorbidity: 5, // 共病数量 (0-3种, 权重高)
            lowBmi: 1,    // 低BMI/衰弱 (二元变量, 权重中等)
        };

        const THRESHOLDS = {
            low: 30,      // 低风险: Score < 30
            medium: 60,   // 中风险: 30 <= Score < 60
            high: 1000,   // 高风险: Score >= 60
        };
        
        // 独居/低参与度 的分数映射（与单选框的 value 对应）
        // 0分: 参与高; 5分: 参与中等; 10分: 参与低/独居
        
        // 低BMI/衰弱 的分数映射（与单选框的 value 对应）
        // 0分: 正常; 15分: 过轻/衰弱风险

        function calculateRisk() {
            // 1. 获取输入值 (已更新为从 radio buttons 获取值)
            const painElement = document.querySelector('input[name="painLevel"]:checked');
            const socialElement = document.querySelector('input[name="socialStatus"]:checked');
            const comorbidityElement = document.querySelector('input[name="comorbidityNum"]:checked');
            const bmiElement = document.querySelector('input[name="lowBmi"]:checked');

            // 检查是否有未选择的项
            if (!painElement || !socialElement || !comorbidityElement || !bmiElement) {
                // 使用自定义的 message box 替代 alert()
                showTemporaryMessage("请确保所有风险因素都已选择。", "bg-red-200 border-red-500 text-red-800");
                return; 
            }

            const painScore = parseInt(painElement.value);
            const socialStatusScore = parseInt(socialElement.value);
            const comorbidityCount = parseInt(comorbidityElement.value);
            const lowBmiScore = parseInt(bmiElement.value);

            // 2. 风险计算 (基于简化的加权总分模型)
            // 慢性疼痛 (0-40分, 疼痛值 x 4)
            const painRisk = painScore * WEIGHTS.pain;
            
            // 社会隔离 (0-10分)
            const socialRisk = socialStatusScore; 
            
            // 共病风险 (0-15分, 共病数 x 5)
            const comorbidityRisk = comorbidityCount * WEIGHTS.comorbidity; 
            
            // 低BMI/衰弱风险 (0-15分)
            const bmiRisk = lowBmiScore; 

            // 总风险分数 (理论最大值: 40 + 10 + 15 + 15 = 80)
            const totalScore = painRisk + socialRisk + comorbidityRisk + bmiRisk;

            // 3. 确定风险等级和建议
            let level, color, guidance, iconPath;

            if (totalScore >= THRESHOLDS.medium) {
                level = "高风险 (需立即转介)";
                color = "border-red-500 bg-red-50";
                guidance = "您的风险评分表明共病抑郁风险较高。请立即联系您的家庭医生或基层医疗机构，并强烈建议转介至**多学科协作(MDT)门诊**或精神卫生中心进行进一步评估和整合干预。";
                iconPath = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>';
            } else if (totalScore >= THRESHOLDS.low) {
                level = "中风险 (建议重点关注)";
                color = "border-amber-500 bg-amber-50";
                guidance = "您的风险评分处于中等水平。建议基层医生将您纳入**重点管理人群**。请加强**社区参与**（如KOA互助小组），并定期接受疼痛管理和基础心理健康教育。";
                iconPath = '<path fill-rule="evenodd" d="M8.257 3.34A1 1 0 007 4.25v11.5a1 1 0 001.257.91l6.45-3.226a1 1 0 000-1.788L8.257 3.34zM10 18a8 8 0 100-16 8 8 0 000 16z" clip-rule="evenodd"></path>';
            } else {
                level = "低风险 (常规管理)";
                color = "border-green-500 bg-green-50";
                guidance = "您的风险评分较低。请继续保持积极的社会参与和规律的康复运动。基层医疗机构将对您进行**常规慢病管理**和健康指导。";
                iconPath = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>';
            }

            // 4. 更新UI显示结果
            const resultBox = document.getElementById('resultBox');
            resultBox.className = `mt-8 p-6 border-4 rounded-xl transition duration-500 ${color}`;
            resultBox.classList.remove('hidden');

            document.getElementById('riskLevel').textContent = level;
            document.getElementById('riskScoreDisplay').textContent = `综合风险评分: ${totalScore} 分 (满分 80 分)`;
            document.getElementById('riskGuidance').textContent = guidance;
            document.getElementById('resultIcon').innerHTML = iconPath;
        }

        // 自定义消息框函数 (替代 alert/confirm)
        function showTemporaryMessage(message, className) {
            let msgBox = document.getElementById('tempMessageBox');
            if (!msgBox) {
                msgBox = document.createElement('div');
                msgBox.id = 'tempMessageBox';
                msgBox.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 p-4 rounded-lg shadow-xl z-50 text-center font-semibold transition-opacity duration-300 opacity-0';
                document.body.appendChild(msgBox);
            }
            msgBox.textContent = message;
            msgBox.className = `fixed top-4 left-1/2 transform -translate-x-1/2 p-4 rounded-lg shadow-xl z-50 text-center font-semibold transition-opacity duration-300 ${className}`;
            msgBox.style.opacity = '1';

            setTimeout(() => {
                msgBox.style.opacity = '0';
            }, 3000);
        }

        window.onload = function() {
            // No initialization needed here.
        };
    </script>
</body>
</html>
